<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ClinIQ</title>
    <script>
      // Apply the saved theme before first paint, otherwise a dark-mode user
      // sees a white flash while React mounts.
      (function () {
        try {
          var keys = Object.keys(localStorage).filter(function (k) {
            return k.indexOf("cliniq-theme:") === 0;
          });
          var saved = null;
          var auth = localStorage.getItem("doctor-app-auth");
          if (auth) {
            var id = (JSON.parse(auth).user || {}).id;
            if (id) saved = localStorage.getItem("cliniq-theme:" + id);
          }
          if (!saved && keys.length) saved = localStorage.getItem("cliniq-theme:guest");
          var theme = saved || "system";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (
            theme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            root.classList.add("sys-dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
